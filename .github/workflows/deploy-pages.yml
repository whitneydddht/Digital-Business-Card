name: Deploy digital business card to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/nfc-business-card-url-3y81ka
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Turns on GitHub Pages automatically if it isn't already enabled
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Copy just the public files into a clean folder to publish
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html contact.vcf .nojekyll _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
